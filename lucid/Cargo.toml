[package]
name = "lucid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open-source runtime that runs the Android build of Roblox on Linux"

# The project is Veneer (codename Lucid): the command is `veneer`, while the
# crates, data folders and app ID keep the codename.
[[bin]]
name = "veneer"
path = "src/main.rs"

[dependencies]
libc.workspace = true
log.workspace = true
lucid-linker.workspace = true
lucid-bionic.workspace = true
lucid-jni.workspace = true
lucid-android.workspace = true
lucid-discord.workspace = true
winit = "0.30"
raw-window-handle = "0.6"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
ureq = "2"
serde_json = "1.0.154"
wayland-client = "0.31"
ab_glyph = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
# xdg-toplevel-icon (the window's own icon on Wayland) is a staging protocol.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
smithay-clipboard = "0.7.3"
gpapi = "6.1.0"
# Decodes the window icon for X11.
png = "0.18.1"
# Checks APK signatures (already in the build through rustls).
ring = "0.17"
tokio = { version = "1.54.1", features = ["rt"] }

# gpapi talks to Google Play through OpenSSL. By default OpenSSL is built
# from source so no system development package is needed (without ALPN:
# Google Play rejects HTTP/2 from this client); build with
# `--no-default-features` to link the system libssl instead.
reqwest = { version = "0.13", default-features = false, optional = true }

[features]
default = ["vendored-openssl"]
vendored-openssl = ["dep:reqwest", "reqwest/native-tls-vendored-no-alpn"]

[lints]
workspace = true

# Packages built by .github/workflows/release.yml (cargo-deb and
# cargo-generate-rpm). The runtime libraries are loaded with dlopen, so they
# are not found automatically and are listed here by hand.
[package.metadata.deb]
name = "veneer"
maintainer = "Veneer Project"
copyright = "Veneer Project contributors"
license-file = ["../LICENSE", "0"]
extended-description = """\
Veneer loads the official Android x86-64 build of Roblox into a normal Linux \
process and supplies the Android system libraries it expects."""
section = "games"
priority = "optional"
depends = "$auto, libvulkan1, libwayland-client0, libwayland-egl1, libegl1, libpulse0"
recommends = "libwebkit2gtk-4.1-0, libgtk-3-0t64 | libgtk-3-0"
assets = [
    ["target/release/veneer", "usr/bin/", "755"],
    ["../packaging/veneer.desktop", "usr/share/applications/", "644"],
    ["../assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/veneer.svg", "644"],
    ["../assets/icons/16.png", "usr/share/icons/hicolor/16x16/apps/veneer.png", "644"],
    ["../assets/icons/24.png", "usr/share/icons/hicolor/24x24/apps/veneer.png", "644"],
    ["../assets/icons/32.png", "usr/share/icons/hicolor/32x32/apps/veneer.png", "644"],
    ["../assets/icons/48.png", "usr/share/icons/hicolor/48x48/apps/veneer.png", "644"],
    ["../assets/icons/64.png", "usr/share/icons/hicolor/64x64/apps/veneer.png", "644"],
    ["../assets/icons/128.png", "usr/share/icons/hicolor/128x128/apps/veneer.png", "644"],
    ["../assets/icons/256.png", "usr/share/icons/hicolor/256x256/apps/veneer.png", "644"],
    ["../assets/icons/512.png", "usr/share/icons/hicolor/512x512/apps/veneer.png", "644"],
    ["../README.md", "usr/share/doc/veneer/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "veneer"
summary = "Run the Android build of Roblox on Linux"
url = "https://github.com/Veneer-Project/Veneer-Project"
assets = [
    { source = "target/release/veneer", dest = "/usr/bin/veneer", mode = "755" },
    { source = "../packaging/veneer.desktop", dest = "/usr/share/applications/veneer.desktop", mode = "644" },
    { source = "../assets/logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/veneer.svg", mode = "644" },
    { source = "../assets/icons/16.png", dest = "/usr/share/icons/hicolor/16x16/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/24.png", dest = "/usr/share/icons/hicolor/24x24/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/32.png", dest = "/usr/share/icons/hicolor/32x32/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/48.png", dest = "/usr/share/icons/hicolor/48x48/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/64.png", dest = "/usr/share/icons/hicolor/64x64/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/128.png", dest = "/usr/share/icons/hicolor/128x128/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/256.png", dest = "/usr/share/icons/hicolor/256x256/apps/veneer.png", mode = "644" },
    { source = "../assets/icons/512.png", dest = "/usr/share/icons/hicolor/512x512/apps/veneer.png", mode = "644" },
    { source = "../README.md", dest = "/usr/share/doc/veneer/README.md", mode = "644", doc = true },
    { source = "../LICENSE", dest = "/usr/share/licenses/veneer/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libvulkan.so.1()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libpulse-simple.so.0()(64bit)" = "*"
