[package]
name = "lucid"
version.workspace = true
edition.workspace = true
license.workspace = true

# The project is Veneer (codename Lucid): the command is `veneer`, while the
# crates, data folders and app ID keep the codename.
[[bin]]
name = "veneer"
path = "src/main.rs"

[dependencies]
libc.workspace = true
log.workspace = true
lucid-linker.workspace = true
lucid-bionic.workspace = true
lucid-jni.workspace = true
lucid-android.workspace = true
lucid-discord.workspace = true
winit = "0.30"
raw-window-handle = "0.6"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
ureq = "2"
serde_json = "1.0.154"
wayland-client = "0.31"
ab_glyph = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
# xdg-toplevel-icon (the window's own icon on Wayland) is a staging protocol.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
smithay-clipboard = "0.7.3"
gpapi = "6.1.0"
# Decodes the window icon for X11.
png = "0.18.1"
# Checks APK signatures (already in the build through rustls).
ring = "0.17"
tokio = { version = "1.54.1", features = ["rt"] }

# gpapi talks to Google Play through OpenSSL. By default OpenSSL is built
# from source so no system development package is needed (without ALPN:
# Google Play rejects HTTP/2 from this client); build with
# `--no-default-features` to link the system libssl instead.
reqwest = { version = "0.13", default-features = false, optional = true }

[features]
default = ["vendored-openssl"]
vendored-openssl = ["dep:reqwest", "reqwest/native-tls-vendored-no-alpn"]

[lints]
workspace = true
